<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GYMSIBS</title>
<link rel="icon" type="image/png" href="assets/gymsibs-icon.png">
<link rel="apple-touch-icon" href="assets/gymsibs-icon.png">
<meta name="theme-color" content="#ff168f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
@import url('https://fonts.googleapis.com/css2?family=Bangers&family=Luckiest+Guy&family=Permanent+Marker&display=swap');
#splash{position:fixed;inset:0;z-index:9999;background:#171019;display:flex;align-items:center;justify-content:center;overflow:hidden;transition:opacity .45s ease,visibility .45s ease}
#splash.hide{opacity:0;visibility:hidden;pointer-events:none}
#splash img{width:100%;height:100%;object-fit:cover;object-position:center;display:block}
#splash:after{content:"";position:absolute;left:50%;bottom:34px;transform:translateX(-50%);width:150px;height:9px;background:#fff5e8;border:3px solid #171019;box-shadow:4px 4px #000;animation:splashbar 2.35s ease-in-out forwards}
#splash:before{content:"CARGANDO...";position:absolute;z-index:2;left:50%;bottom:54px;transform:translateX(-50%) rotate(-2deg);background:#ffd600;border:3px solid #171019;box-shadow:4px 4px #000;padding:6px 13px;font:20px Bangers;white-space:nowrap}
@keyframes splashbar{from{width:18px}to{width:150px}}
:root{--p:#ff168f;--b:#009fe8;--y:#ffd600;--l:#b8ff00;--v:#8f32ff;--ink:#171019;--paper:#fff5e8}
*{box-sizing:border-box}body{margin:0;background:#111;font-family:Arial;color:var(--ink)}button,input{font:inherit}button{cursor:pointer}
#app{max-width:580px;min-height:100vh;margin:auto;background:var(--paper);padding-bottom:82px;position:relative;overflow:hidden;box-shadow:0 0 50px #000}
#app:before{content:"";position:absolute;inset:68px 0 0;background-image:radial-gradient(#17101922 1px,transparent 1px);background-size:9px 9px;opacity:.35;pointer-events:none}
header{height:68px;background:var(--p);border-bottom:4px solid var(--ink);display:flex;align-items:center;justify-content:space-between;padding:0 14px;position:sticky;top:0;z-index:10}.logo{display:flex;align-items:center;gap:6px;font:31px 'Luckiest Guy';color:#fff;text-shadow:3px 3px #171019;background:none}.logo b{color:var(--y)}.mini-logo{width:34px;height:34px;border:2px solid var(--ink);border-radius:50%;object-fit:cover}.top{width:40px;height:40px;background:#fff;border:3px solid var(--ink);box-shadow:3px 3px #171019;display:grid;place-items:center}
main{position:relative;z-index:2;padding:14px}.speech{background:#fff;border:3px solid var(--ink);box-shadow:4px 4px #171019;width:max-content;margin:auto;padding:8px 15px;font:16px 'Permanent Marker';transform:rotate(-1deg)}
.hero{margin-top:14px;min-height:190px;background:linear-gradient(110deg,var(--p) 0 49%,var(--b) 51%);border:4px solid var(--ink);box-shadow:6px 6px #171019;display:grid;grid-template-columns:1fr 60px 1fr;align-items:center;color:#fff;text-align:center;text-shadow:2px 2px #171019}.fighter{display:flex;flex-direction:column;align-items:center}.avatar{width:78px;height:78px;border-radius:50%;background:var(--paper);color:var(--ink);border:4px solid var(--ink);box-shadow:4px 4px #171019;display:block;object-fit:cover}.fighter b,.fighter strong,.vs,h1,h2,.action,.card label,.result .burst{font-family:'Bangers'}.fighter b{font-size:28px}.fighter small{font-size:9px;font-weight:bold}.fighter strong{font-size:38px}.vs{font-size:31px;color:var(--y);-webkit-text-stroke:2px #171019}
.card{background:#fff;border:3px solid var(--ink);box-shadow:5px 5px #171019;padding:14px;margin:17px 2px;position:relative}.card label{font-size:18px;border-bottom:2px dashed #171019;display:block;padding-bottom:6px}.latest h3{margin:8px 0}.latest .row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #ddd}.pink{color:var(--p)}.blue{color:#008bd0}.latest em{position:absolute;right:9px;bottom:10px;background:var(--y);border:3px solid var(--ink);box-shadow:3px 3px #171019;padding:6px;font:18px Bangers}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.action{min-height:72px;border:3px solid var(--ink);box-shadow:4px 4px #171019;font-size:22px}.p{background:var(--p);color:#fff}.bl{background:var(--b);color:#fff}.ye{background:var(--y)}.li{background:var(--l)}.wide,.add,.register{width:100%;margin-top:12px;padding:13px;border:3px solid var(--ink);box-shadow:4px 4px #171019;font:20px Bangers;background:#fff}
.head{display:grid;grid-template-columns:40px 1fr 28px;align-items:center;margin:4px 0 15px}.head h1{text-align:center;font-size:31px;margin:0}.head button{background:none}.search{background:#fff;border:3px solid var(--ink);box-shadow:3px 3px #171019;padding:12px;margin-bottom:10px;display:flex;justify-content:space-between;color:#777}.exercise{width:100%;background:#fff;border:2px solid var(--ink);box-shadow:2px 2px #171019;margin:4px 0;padding:10px;display:grid;grid-template-columns:46px 1fr 20px;text-align:left;align-items:center}.exercise>span{font-size:25px}.exercise b,.exercise small{display:block}.exercise small{font-size:11px;color:#777}.add{background:var(--p);color:#fff}.addform{display:flex;gap:8px;margin-top:12px}.addform input{flex:1;padding:10px;border:3px solid var(--ink)}.addform button{background:var(--l);border:3px solid var(--ink);font-weight:bold}
.panel{padding:14px;border:4px solid var(--ink);box-shadow:5px 5px #171019}.ara{background:var(--p)}.sergio{background:var(--b)}.name{font:30px Bangers;color:#fff;text-shadow:2px 2px #171019;margin-bottom:8px}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{background:#fff;border:3px solid var(--ink);box-shadow:3px 3px #171019;padding:7px}.metric small{font-weight:bold;font-size:9px}.metric input{display:block;width:100%;border:0;background:none;text-align:center;font:31px Bangers;outline:0}.metric div{display:flex;gap:4px}.metric button{flex:1;border:2px solid var(--ink)}.middle{position:relative;z-index:3;width:64px;margin:-5px auto;background:var(--y);border:3px solid var(--ink);box-shadow:3px 3px #171019;text-align:center;font:29px Bangers;transform:rotate(-4deg)}.register{background:var(--l);font-size:23px}.note{text-align:center;font-size:11px;color:#777}
.tabs{display:grid;grid-template-columns:1fr 1fr;border:3px solid var(--ink);box-shadow:3px 3px #171019}.tabs button{padding:10px;border:0;background:#fff;font:20px Bangers}.selp{background:var(--p)!important;color:#fff}.selb{background:var(--b)!important;color:#fff}.stats{display:grid;grid-template-columns:repeat(3,1fr);background:var(--y);border:3px solid var(--ink);box-shadow:4px 4px #171019;margin:14px 0}.stats div{text-align:center;padding:9px;border-right:2px solid var(--ink)}.stats div:last-child{border:0}.stats b,.stats small{display:block}.stats b{font:27px Bangers}.stats small{font-size:9px;font-weight:bold}.bar{display:grid;grid-template-columns:90px 1fr 48px;gap:6px;align-items:center;margin:12px 0;font-size:11px}.track{height:18px;background:#eee;border:2px solid var(--ink)}.track i{display:block;height:100%;background:var(--p)}.history{display:grid;grid-template-columns:72px 1fr auto;gap:5px;padding:8px 0;border-bottom:1px solid #ddd;font-size:10px}
.score{display:grid;grid-template-columns:1fr 55px 1fr;text-align:center;background:linear-gradient(90deg,var(--p),var(--b));color:#fff;border:4px solid var(--ink);box-shadow:5px 5px #171019;padding:13px;text-shadow:2px 2px #171019}.score span,.score b,.score strong{display:block;font-family:Bangers}.score span{font-size:24px}.score b{font-size:54px}.score strong{color:var(--y)}.duelrow{display:grid;grid-template-columns:48px 1fr 48px;text-align:center;background:#fff;border:3px solid var(--ink);margin:8px 0;padding:9px}.duelrow>b{font:18px Bangers}.duelrow>span{font:22px Bangers}.duelrow small{grid-column:1/-1;background:var(--y);font-weight:bold;margin-top:5px}.ach{display:grid;grid-template-columns:1fr 1fr;gap:10px}.achievement{background:#ccc;border:3px solid var(--ink);box-shadow:4px 4px #171019;padding:12px;text-align:center;opacity:.45}.achievement.on{opacity:1;background:var(--y)}.achievement>div{font-size:38px}.achievement b,.achievement small,.achievement span{display:block}.achievement b{font:20px Bangers}.achievement small{font-size:10px}.achievement span{font-size:8px;font-weight:bold;background:var(--l);border:1px solid var(--ink);padding:3px}.month{text-align:center;font:25px Bangers}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.calendar>*{aspect-ratio:1;display:grid;place-items:center}.calendar b{font-size:11px}.calendar span{background:#fff;border:2px solid #ddd;font-weight:bold}.calendar .trained{background:var(--p);color:#fff;border-color:var(--ink);border-radius:50%;box-shadow:2px 2px #171019}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(580px,100%);height:76px;background:#fff;border-top:4px solid var(--ink);display:grid;grid-template-columns:1fr 1fr 1fr 1fr 1fr;z-index:20}.bottom button{border:0;background:#fff;font-size:9px;font-weight:bold;display:flex;flex-direction:column;align-items:center;justify-content:center}.bottom .active{color:var(--p)}.duelbtn{width:57px;height:57px;align-self:center;justify-self:center;border-radius:50%!important;background:var(--y)!important;border:4px solid var(--ink)!important;box-shadow:4px 4px #171019}.overlay{position:fixed;inset:0;z-index:100;background:#0009;display:flex;align-items:end}.more{width:min(580px,100%);background:var(--paper);border:4px solid var(--ink);padding:14px}.more button{width:100%;padding:13px;background:#fff;border:3px solid var(--ink);box-shadow:3px 3px #171019;margin:4px 0;font:20px Bangers;text-align:left}.result{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;animation:pop .2s}.result.ara{background:linear-gradient(135deg,var(--p),var(--y))}.result.sergio{background:linear-gradient(135deg,var(--b),var(--l))}.result.tie{background:linear-gradient(135deg,var(--v),var(--y))}.result .burst{font-size:clamp(65px,18vw,120px);color:var(--y);-webkit-text-stroke:4px var(--ink);text-shadow:6px 6px #171019;transform:rotate(-5deg);margin-bottom:25px}.resultcard{background:#fff;border:4px solid var(--ink);box-shadow:7px 7px #171019;padding:18px;max-width:430px}.resultcard b{font:26px Bangers;display:block}.resultcard strong{font:72px Bangers;display:block}.resultcard p{font:16px 'Permanent Marker'}.result>button{margin-top:20px;background:var(--y);border:3px solid var(--ink);box-shadow:4px 4px #171019;padding:12px 30px;font:22px Bangers}@keyframes pop{from{transform:scale(.75);opacity:0}to{transform:scale(1);opacity:1}}
</style>
</head>
<body>
<div id="splash"><img src="assets/gymsibs-splash.jfif" alt="GYMSIBS"></div>
<div id="app"></div>
<script>
const KEY="gymsibs-v1";
const demo={exercises:[
{id:"bench",name:"Press banca",group:"Pecho",icon:"🏋️"},{id:"squat",name:"Sentadilla",group:"Piernas",icon:"🦵"},{id:"deadlift",name:"Peso muerto",group:"Espalda",icon:"💥"},{id:"row",name:"Remo con barra",group:"Espalda",icon:"🚣"},{id:"shoulder",name:"Press militar",group:"Hombros",icon:"💪"},{id:"pullup",name:"Dominadas",group:"Espalda",icon:"🦍"}],
records:[{date:"2026-09-01",exercise:"bench",ara:{weight:42.5,reps:10},sergio:{weight:40,reps:10}},{date:"2026-09-01",exercise:"squat",ara:{weight:60,reps:8},sergio:{weight:70,reps:8}},{date:"2026-09-03",exercise:"bench",ara:{weight:42.5,reps:10},sergio:{weight:45,reps:8}}]};
let data=JSON.parse(localStorage.getItem(KEY)||"null")||demo, screen="home", exid=null, result=null, person="ara", adding=false;
const save=()=>localStorage.setItem(KEY,JSON.stringify(data));
const totals=()=>data.records.reduce((x,r)=>(r.ara.weight>r.sergio.weight?x.ara++:r.sergio.weight>r.ara.weight?x.sergio++:0,x),{ara:0,sergio:0});
function header(title,back=""){return `<div class="head"><button onclick="${back?`go('${back}')`:''}">${back?"←":""}</button><h1>${title}</h1><span>✦</span></div>`}
function render(){
 let t=totals(), html=`<header><button class="top" onclick="more()">☰</button><button class="logo" onclick="go('home')"><img class="mini-logo" src="assets/gymsibs-icon.png" alt=""> GYM <b>SIBS</b></button><button class="top" onclick="go('achievements')">🏆</button></header><main>`;
 if(screen==="home") html+=home(t);
 if(screen==="exercises") html+=exercises();
 if(screen==="workout") html+=workout();
 if(screen==="progress") html+=progress(t);
 if(screen==="duel") html+=duel(t);
 if(screen==="achievements") html+=achievements(t);
 if(screen==="calendar") html+=calendar();
 html+=`</main><nav class="bottom"><button class="${screen==="home"?"active":""}" onclick="go('home')">⌂<small>INICIO</small></button><button class="${["exercises","workout"].includes(screen)?"active":""}" onclick="go('exercises')">🏋<small>ENTRENAR</small></button><button class="duelbtn" onclick="go('duel')">⚡</button><button class="${screen==="progress"?"active":""}" onclick="go('progress')">▥<small>PROGRESO</small></button><button onclick="more()">☰<small>MÁS</small></button></nav>`;
 document.getElementById("app").innerHTML=html;
 if(result)document.body.insertAdjacentHTML("beforeend",resultOverlay());
}
function home(t){let r=data.records.at(-1),e=r&&data.exercises.find(x=>x.id===r.exercise);return `<div class="speech">¡A DARLO TODO! ⚡</div><div class="hero"><div class="fighter"><img class="avatar" src="assets/ara-profile.png" alt="Ara"><b>ARA</b><small>RÉCORDS</small><strong>${t.ara}</strong></div><div class="vs">VS</div><div class="fighter"><img class="avatar" src="assets/sergio-profile.png" alt="Sergio"><b>SERGIO</b><small>RÉCORDS</small><strong>${t.sergio}</strong></div></div>${r?`<div class="card latest"><label>ÚLTIMO ENTRENAMIENTO</label><h3>${e.name}</h3><div class="row"><span class="pink">Ara</span><b>${r.ara.weight} kg × ${r.ara.reps}</b></div><div class="row"><span class="blue">Sergio</span><b>${r.sergio.weight} kg × ${r.sergio.reps}</b></div><em>${r.ara.weight>r.sergio.weight?"KACHOW!":r.sergio.weight>r.ara.weight?"BRUTAL!":"WOW!"}</em></div>`:""}<div class="grid"><button class="action p" onclick="go('exercises')">🏋 ENTRENAR</button><button class="action bl" onclick="go('progress')">📈 PROGRESO</button><button class="action ye" onclick="go('duel')">⚡ DUELO</button><button class="action li" onclick="go('achievements')">🏆 LOGROS</button></div><button class="wide" onclick="go('calendar')">📅 CALENDARIO</button>`}
function exercises(){return header("ELIGE TU EJERCICIO","home")+`<div class="search">Buscar ejercicio... <b>⌕</b></div><div>${data.exercises.map(e=>`<button class="exercise" onclick="openEx('${e.id}')"><span>${e.icon}</span><div><b>${e.name}</b><small>${e.group}</small></div><strong>›</strong></button>`).join("")}</div>${adding?`<div class="addform"><input id="newex" placeholder="Nombre del ejercicio"><button onclick="addEx()">AÑADIR</button></div>`:`<button class="add" onclick="adding=true;render()">＋ AÑADIR EJERCICIO</button>`}`}
function workout(){let e=data.exercises.find(x=>x.id===exid)||data.exercises[0],last=[...data.records].reverse().find(r=>r.exercise===e.id),a=last?.ara||{weight:20,reps:10},s=last?.sergio||{weight:20,reps:10};return header(e.name.toUpperCase(),"exercises")+`<div class="panel ara"><div class="name">ARA</div>${metrics("a",a)}</div><div class="middle">VS</div><div class="panel sergio"><div class="name">SERGIO</div>${metrics("s",s)}</div><button class="register" onclick="register()">¡REGISTRAR! ⚡</button><p class="note">Los datos se guardan automáticamente en este dispositivo.</p>`}
function metrics(prefix,v){return `<div class="metrics"><label class="metric"><small>PESO (KG)</small><input id="${prefix}w" type="number" step=".5" value="${v.weight}"><div><button onclick="step('${prefix}w',-1)">−</button><button onclick="step('${prefix}w',1)">+</button></div></label><label class="metric"><small>REPETICIONES</small><input id="${prefix}r" type="number" value="${v.reps}"><div><button onclick="step('${prefix}r',-1)">−</button><button onclick="step('${prefix}r',1)">+</button></div></label></div>`}
function progress(t){let rows=data.exercises.map(e=>{let r=data.records.filter(x=>x.exercise===e.id);return r.length?{...e,best:Math.max(...r.map(x=>x[person].weight))}:null}).filter(Boolean);return header("MI PROGRESO")+`<div class="tabs"><button class="${person==="ara"?"selp":""}" onclick="person='ara';render()">ARA</button><button class="${person==="sergio"?"selb":""}" onclick="person='sergio';render()">SERGIO</button></div><div class="stats"><div><b>${data.records.length}</b><small>SESIONES</small></div><div><b>${Math.max(t.ara,t.sergio)}</b><small>VICTORIAS</small></div><div><b>${rows.length}</b><small>EJERCICIOS</small></div></div><div class="card"><label>MEJORES MARCAS</label>${rows.map(x=>`<div class="bar"><span>${x.name}</span><i class="track"><i style="width:${Math.min(100,x.best)}%"></i></i><b>${x.best} kg</b></div>`).join("")}</div><div class="card"><label>HISTORIAL RECIENTE</label>${data.records.slice(-10).reverse().map(r=>`<div class="history"><span>${r.date}</span><b>${data.exercises.find(e=>e.id===r.exercise)?.name}</b><span>${r[person].weight} × ${r[person].reps}</span></div>`).join("")}</div>`}
function duel(t){return header("DUELO")+`<div class="score"><div><span>ARA</span><b>${t.ara}</b></div><strong>VS</strong><div><span>SERGIO</span><b>${t.sergio}</b></div></div>${data.exercises.map(e=>{let r=data.records.filter(x=>x.exercise===e.id);if(!r.length)return"";let a=Math.max(...r.map(x=>x.ara.weight)),s=Math.max(...r.map(x=>x.sergio.weight));return `<div class="duelrow"><span class="pink">${a}</span><b>${e.name}</b><span class="blue">${s}</span><small>${a>s?"🏆 Ara":s>a?"🏆 Sergio":"🤝 Empate"}</small></div>`}).join("")}`}
function achievements(t){let n=data.records.length,items=[["💥","KACHOW!","Primer entrenamiento",n>=1],["⚡","MACHINE","5 registros",n>=5],["🩷","NO HAY QUIEN LA PARE","Ara gana un ejercicio",t.ara>=1],["⭐","MR. WONDERFUL","Sergio gana un ejercicio",t.sergio>=1],["🏆","COMEBACK KING","Duelo en tablas",n&&t.ara===t.sergio],["🔥","A POR EL SIGUIENTE","10 registros",n>=10]];return header("MIS LOGROS")+`<div class="ach">${items.map(x=>`<div class="achievement ${x[3]?"on":""}"><div>${x[0]}</div><b>${x[1]}</b><small>${x[2]}</small>${x[3]?"<span>DESBLOQUEADO</span>":""}</div>`).join("")}</div>`}
function calendar(){let nums=Array.from({length:30},(_,i)=>i+1);return header("CALENDARIO")+`<h2 class="month">SEPTIEMBRE 2026</h2><div class="calendar">${["L","M","X","J","V","S","D"].map(x=>`<b>${x}</b>`).join("")}${nums.map(n=>`<span class="${data.records.some(r=>+r.date.slice(-2)===n)?"trained":""}">${n}</span>`).join("")}</div><p class="note">🩷 Ara &nbsp; 💙 Sergio &nbsp; 💚 Ambos</p>`}
function resultOverlay(){let r=result,a=r.winner==="ara",s=r.winner==="sergio";return `<div class="result ${r.winner}" id="result"><div class="burst">${a?"KACHOW!":s?"BRUTAL!":"WOW!"}</div><div class="resultcard"><b>${a?"¡ARA LEVANTA MÁS PESO!":s?"¡SERGIO LEVANTA MÁS PESO!":"¡EMPATE!"}</b><strong>${a?r.values.ara.weight:s?r.values.sergio.weight:r.values.ara.weight} KG</strong><p>${a?"WOW, SERGIO. ARA LEVANTA MÁS QUE TÚ 😎":s?"¡ASÍ SE HACE! ¡QUÉ BESTIA! ⭐":"NADIE SE RINDE. ¡A POR LA SIGUIENTE!"}</p></div><button onclick="closeResult()">CONTINUAR</button></div>`}
function go(s){screen=s;result=null;render()}function openEx(id){exid=id;screen="workout";render()}function step(id,n){let x=document.getElementById(id);x.value=Math.max(0,(Number(x.value)||0)+n)}function register(){let aw=+document.getElementById("aw").value||0,ar=+document.getElementById("ar").value||0,sw=+document.getElementById("sw").value||0,sr=+document.getElementById("sr").value||0;let winner=aw===sw?"tie":aw>sw?"ara":"sergio";data.records.push({date:new Date().toISOString().slice(0,10),exercise:exid,ara:{weight:aw,reps:ar},sergio:{weight:sw,reps:sr}});save();result={winner,values:{ara:{weight:aw,reps:ar},sergio:{weight:sw,reps:sr}}};render()}function closeResult(){result=null;render()}function addEx(){let n=document.getElementById("newex").value.trim();if(!n)return;data.exercises.push({id:"e"+Date.now(),name:n,group:"Otros",icon:"🏋️"});save();adding=false;render()}function more(){document.body.insertAdjacentHTML("beforeend",`<div class="overlay" id="menu" onclick="this.remove()"><div class="more" onclick="event.stopPropagation()"><button onclick="go('calendar');document.getElementById('menu').remove()">📅 Calendario</button><button onclick="go('achievements');document.getElementById('menu').remove()">🏆 Logros</button><button onclick="go('exercises');document.getElementById('menu').remove()">🏋 Ejercicios</button><button onclick="this.closest('.overlay').remove()">✕ Cerrar</button></div></div>`)}
render();
setTimeout(()=>document.getElementById("splash")?.classList.add("hide"),2700);
setTimeout(()=>document.getElementById("splash")?.remove(),3250);
</script></body></html>
